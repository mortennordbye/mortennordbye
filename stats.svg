         <polyline class="draw" points="40,228 55,223 69,223 84,224 98,231 113,226 128,231 142,228 157,230 172,228 186,211 201,219 215,208 230,205 245,181 259,197 274,193 288,170 303,216 318,189 332,209 347,208 362,201 376,210 391,215 405,219 420,207 435,222 449,204 464,211 478,204 493,219 508,225 522,232 537,206 552,187 566,219 581,186 595,212 610,205 625,214 639,211 654,172 668,166 683,222 698,185 712,176 727,166 742,194 756,181 771,208 785,191 800,209" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
