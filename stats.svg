<svg xmlns="http://www.w3.org/2000/svg" width="840" height="254" viewBox="0 0 840 254" role="img">
  <defs>
    <style>
  .reveal{animation:rise .7s cubic-bezier(.2,.7,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .bar{transform-box:fill-box;transform-origin:bottom;animation:grow .9s cubic-bezier(.2,.7,.3,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .skbar{transform-box:fill-box;transform-origin:left;animation:growx 1.1s cubic-bezier(.2,.7,.3,1) both}
  @keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .shimmer{animation:sweep 3.4s ease-in-out infinite}
  @keyframes sweep{0%{transform:translateX(-45%)}50%{transform:translateX(45%)}100%{transform:translateX(-45%)}}
  .pulse{animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  .draw{stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 2.4s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fadein{opacity:0;animation:fadein 1.2s ease-out .5s forwards}
  @keyframes fadein{to{opacity:1}}</style>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#378144"/><stop offset="0.5" stop-color="#40a551"/><stop offset="1" stop-color="#3d954c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.75"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f5f1"/><stop offset="0.6" stop-color="#e7eee8"/><stop offset="1" stop-color="#f9fbf9"/>
      <animate attributeName="x2" values="1;0.7;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="topclip"><rect x="0" y="0" width="840" height="3"/></clipPath>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="253" rx="14" fill="#f9fbf9" stroke="#d1ddd3"/>
  <g clip-path="url(#topclip)">
         <rect x="0" y="0" width="840" height="3" fill="url(#accent)"/>
         <rect class="shimmer" x="290" y="0" width="260" height="3" fill="url(#glow)"/>
       </g>
  <g class="reveal">
      <text x="40" y="40" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#5f7963" text-anchor="start" opacity="1">GITHUB ACTIVITY</text>
      <text x="40" y="86" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#378144" text-anchor="start" opacity="1">30</text>
        <text x="40" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#5f7963" text-anchor="start" opacity="1">PUBLIC REPOS</text><text x="230" y="86" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#378144" text-anchor="start" opacity="1">340</text>
        <text x="230" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#5f7963" text-anchor="start" opacity="1">STARS</text><text x="420" y="86" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#378144" text-anchor="start" opacity="1">3.2k</text>
        <text x="420" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#5f7963" text-anchor="start" opacity="1">COMMITS (1Y)</text><text x="610" y="86" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="26" font-weight="700" fill="#378144" text-anchor="start" opacity="1">24</text>
        <text x="610" y="108" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#5f7963" text-anchor="start" opacity="1">FOLLOWERS</text>
      <line x1="40" y1="130" x2="800" y2="130" stroke="#d1ddd3"/>
      <text x="40" y="152" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="11" font-weight="600" fill="#5f7963" text-anchor="start" opacity="1">CONTRIBUTIONS · LAST 12 MONTHS</text>
      <text x="800" y="152" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace" font-size="12" font-weight="600" fill="#415344" text-anchor="end" opacity="1">7.7k total</text>
      <defs>
           <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
             <stop offset="0" stop-color="#378144" stop-opacity="0.34"/>
             <stop offset="1" stop-color="#378144" stop-opacity="0"/>
           </linearGradient>
