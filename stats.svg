         <polyline class="draw" points="40,229 55,228 69,223 84,223 98,224 113,231 128,226 142,231 157,228 172,230 186,228 201,211 215,219 230,208 245,205 259,181 274,197 288,193 303,170 318,216 332,189 347,209 362,208 376,201 391,210 405,215 420,219 435,207 449,222 464,204 478,211 493,204 508,219 522,225 537,232 552,206 566,187 581,219 595,186 610,212 625,205 639,214 654,211 668,172 683,166 698,222 712,185 727,176 742,166 756,194 771,181 785,208 800,203" fill="none" stroke="url(#accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
