<svg xmlns="http://www.w3.org/2000/svg" width="840" height="62" viewBox="0 0 840 62" role="img">
  <defs><style>@font-face{font-family:'Source Serif 4';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Fragment Mono';src:url(data:font/woff2;base64,) format('woff2')}
  .reveal{animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.7,.3,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .draw{stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 2.6s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fadein{opacity:0;animation:fadein 1.4s ease-out .6s forwards}
  @keyframes fadein{to{opacity:1}}</style><linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="800" y2="0">
