<svg xmlns="http://www.w3.org/2000/svg" width="840" height="168" viewBox="0 0 840 168" role="img">
  <defs>
    <style>@font-face{font-family:'Source Serif 4';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Fragment Mono';src:url(data:font/woff2;base64,) format('woff2')}
  .reveal{animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.7,.3,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .draw{stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 2.6s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fadein{opacity:0;animation:fadein 1.4s ease-out .6s forwards}
  @keyframes fadein{to{opacity:1}}</style>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#191f1a"/><stop offset="0.55" stop-color="#0f1410"/><stop offset="1" stop-color="#090c0a"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a6133" stop-opacity="0.8"/><stop offset="1" stop-color="#7f5a2f" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="800" y2="0">
      <stop offset="0" stop-color="#8a6133" stop-opacity="0.7"/><stop offset="1" stop-color="#7f5a2f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c09955" stop-opacity="0"/><stop offset="0.3" stop-color="#c09955" stop-opacity="0.35"/><stop offset="1" stop-color="#c09955" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="839" height="167" rx="10" fill="url(#ground)" stroke="url(#edge)"/>
  <line x1="24" y1="1" x2="816" y2="1" stroke="url(#lamp)"/>
  <g class="reveal" style="animation-delay:0ms">
    <text x="40" y="44" font-family="'Fragment Mono',ui-monospace,Menlo,Consolas,monospace" font-size="11" fill="#c09955" text-anchor="start" opacity="1" letter-spacing="1.6">NORDBYE.IT  ·  THE STUDY</text>
    <text x="38" y="96" font-family="'Source Serif 4',Georgia,'Times New Roman',serif" font-size="42" fill="#e9ebe9" text-anchor="start" opacity="1">Morten Nordbye</text>
    <line x1="40" y1="116" x2="176" y2="116" stroke="#8a6133"/>
    <text x="40" y="144" font-family="'Source Serif 4',Georgia,'Times New Roman',serif" font-size="16" fill="#a1ada3" text-anchor="start" opacity="1">Senior Platform Engineer  ·  Oslo, Norway  ·  Azure and Kubernetes platforms</text>
  </g>
</svg>