<svg xmlns="http://www.w3.org/2000/svg" width="187.8" height="226" viewBox="0 0 187.8 226" role="img">
  <defs><style>
  .reveal{animation:rise 1.2s cubic-bezier(.16,1,.3,1) both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  .bar{transform-box:fill-box;transform-origin:bottom;animation:grow 1s cubic-bezier(.2,.7,.3,1) both}
  @keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
  .draw{stroke-dasharray:4000;stroke-dashoffset:4000;animation:draw 2.6s cubic-bezier(.2,.7,.3,1) forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .fadein{opacity:0;animation:fadein 1.4s ease-out .6s forwards}
  @keyframes fadein{to{opacity:1}}</style><linearGradient id="rule" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="800" y2="0">
      <stop offset="0" stop-color="#8a6133" stop-opacity="0.7"/><stop offset="1" stop-color="#7f5a2f" stop-opacity="0"/>
    </linearGradient></defs>
  <path d="M0,0 H187.8  V226  H0  V0  Z" fill="#0f1410"/><path d="M187.3,0 V226" fill="none" stroke="#7f5a2f" stroke-opacity="0.6"/>
  
  <g class="reveal" style="animation-delay:0ms"></g>
</svg>